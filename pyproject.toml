[project]
name = "polyreel"
version = "0.1.0"
description = "Play many videos at once in an aspect-preserving masonry layout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "python-mpv>=1.0.4"]

[project.scripts]
polyreel = "polyreel.__main__:main"

[tool.setuptools]
packages = ["polyreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
