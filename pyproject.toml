[project]
name = "masonry-player"
version = "0.1.0"
description = "Play many videos at once in an aspect-preserving masonry layout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "python-mpv>=1.0.4"]

[project.scripts]
masonry-player = "masonry_player.__main__:main"

[tool.setuptools]
packages = ["masonry_player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
